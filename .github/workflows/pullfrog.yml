name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
        required: true
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run agent
        uses: pullfrog/pullfrog@86f7dba19a2e8fddcc11c703e3fd906d8deae145 # v0.1.64
        with:
          prompt: ${{ inputs.prompt }}
          model: openai-compatible/byok
          push: restricted
        env:
          OPENAI_COMPATIBLE_BASE_URL: https://ollama.com/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: deepseek-v4-pro:0813-cloud
          # Pullfrog requires both. 1M context per the Ollama model page;
          # output is capped well below DeepSeek's advertised 384K because
          # ollama.com rejects anything over 65536 (ollama/ollama#16890).
          OPENAI_COMPATIBLE_CONTEXT: "1000000"
          OPENAI_COMPATIBLE_MAX_OUTPUT: "65536"
